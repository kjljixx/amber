[package]
name = "amber"
version = "0.1.0"
edition = "2024"
default-run = "amber"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = { version = "0.18", optional = true }
hound = { version = "3.5", optional = true }
base64 = { version = "0.22", optional = true }
crossterm = "0.29"
getrandom = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }
ratatui = "0.30"
xcap = { version = "0.9.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"], optional = true }

[features]
default = ["generation", "audio", "focus-check"]
generation = ["dep:ureq", "dep:getrandom"]
audio = ["dep:cpal", "dep:hound", "dep:base64"]
focus-check = ["generation", "dep:base64", "dep:image", "dep:xcap", "dep:eframe"]

[[example]]
name = "trace"
required-features = ["audio"]

[[bin]]
name = "jev"
path = "src/bin/jev.rs"
required-features = ["generation"]

[[bin]]
name = "amber"
path = "src/main.rs"
required-features = ["generation"]

# Keep debug symbols, but optimize the CPU renderer for normal `cargo run`.
[profile.dev.package.amber]
opt-level = 3
