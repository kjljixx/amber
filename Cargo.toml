[package]
name = "amber"
version = "0.1.0"
edition = "2024"
default-run = "amber"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = { version = "0.18", optional = true }
base64 = { version = "0.22", optional = true }
crossterm = "0.29"
getrandom = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }
ratatui = "0.30"
xcap = { version = "0.9.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"], optional = true }

[features]
default = ["generation", "audio", "focus-check"]
generation = ["dep:ureq", "dep:getrandom"]
audio = ["dep:cpal"]
focus-check = ["generation", "dep:base64", "dep:image", "dep:xcap"]

[[bin]]
name = "jev"
path = "src/bin/jev.rs"
required-features = ["generation"]

[[bin]]
name = "timer"
path = "src/bin/timer.rs"
required-features = ["generation"]

# Keep debug symbols, but optimize the CPU renderer for normal `cargo run`.
[profile.dev.package.amber]
opt-level = 3
