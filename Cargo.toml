[package]
name = "amber"
version = "0.1.0"
edition = "2024"
default-run = "amber"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"], optional = true }

[features]
default = ["generation"]
generation = ["dep:ureq"]

[[bin]]
name = "jev"
path = "src/bin/jev.rs"
required-features = ["generation"]

[[bin]]
name = "timer"
path = "src/bin/timer.rs"
required-features = ["generation"]

# Keep debug symbols, but optimize the CPU renderer for normal `cargo run`.
[profile.dev.package.amber]
opt-level = 3
